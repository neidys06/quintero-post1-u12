# .github/workflows/ci.yml
# Pipeline de integración continua: en cada push o PR a main compila y prueba
# (job 1) y, solo si eso pasa, construye la imagen Docker y verifica con un
# smoke test que el contenedor arranca y responde UP (job 2).
name: CI — Build, Test & Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Compilar y ejecutar pruebas ──────────────────────────
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 21 con caché Maven
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven            # reutiliza ~/.m2 entre ejecuciones

      - name: Compilar y ejecutar pruebas
        run: mvn -B clean verify  # incluye pruebas y el umbral de JaCoCo

      - name: Publicar reporte de pruebas como artefacto
        uses: actions/upload-artifact@v4
        if: always()              # también si las pruebas fallan, para revisarlas
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  # ── Job 2: Construir la imagen y verificar el monitoreo ──────────
  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test         # no se construye la imagen si las pruebas fallan
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Construir la imagen Docker
        run: docker build -t mi-spring-app:${{ github.sha }} .

      - name: Levantar el contenedor y esperar /actuator/health
        run: |
          docker run -d --name smoke-test -p 8080:8080 mi-spring-app:${{ github.sha }}

          # Hasta 15 intentos cada 2 s (30 s) mientras Spring Boot arranca
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "La aplicacion respondio UP"
              curl -s http://localhost:8080/actuator/health
              exit 0
            fi
            echo "Esperando a que la aplicacion arranque... (${i}/15)"
            sleep 2
          done

          echo "La aplicacion no respondio UP a tiempo"
          docker logs smoke-test
          exit 1

      - name: Detener el contenedor de prueba
        if: always()              # limpia el contenedor aunque el smoke test falle
        run: docker rm -f smoke-test || true
