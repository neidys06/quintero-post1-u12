# src/main/resources/application.properties — común a todos los perfiles
spring.application.name=catalogo-productos
# Railway/Render inyectan PORT; en local se usa 8080
server.port=${PORT:8080}
# Perfil por variable de entorno; sin ella, arranca en dev
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.jpa.open-in-view=false
