# src/main/resources/application-prod.properties — producción (PostgreSQL)
# Las credenciales reales llegan SIEMPRE por variables de entorno. La contraseña
# no tiene valor por defecto utilizable: sin DATASOURCE_PASSWORD la conexión falla.
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/appdb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DATASOURCE_USER:appuser}
spring.datasource.password=${DATASOURCE_PASSWORD:}
# validate: Hibernate verifica el esquema y NO lo modifica. Para el primer
# despliegue sobre una base vacía se define DDL_AUTO=update una sola vez.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.h2.console.enabled=false
logging.level.root=WARN
logging.level.com.universidad=INFO
# Spring Boot imprime el perfil activo con nivel INFO; se mantiene visible en los logs
logging.level.com.universidad.catalogo.CatalogoApplication=INFO

# Actuator: en producción SOLO health e info (beans, env, etc. responden 404)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
